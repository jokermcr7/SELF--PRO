<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>پنل سلف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070709;--card:#121216;--card2:#1b1b21;--line:#2a2a31;--tx:#ffffff;--mut:#9d9da8;--acc:#ff1f3d;--acc2:#ff5a6e;--acc-tx:#ffffff;--red:#ff6b78;--ok:#ffffff;--glow:0 0 22px #ff1f3d66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,-apple-system,sans-serif;font-size:15px}
body{background:radial-gradient(520px 260px at 50% -70px,#4a0713 0%,transparent 70%),var(--bg);padding:0 14px calc(86px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:center;gap:12px;padding:16px 2px 6px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ff3b55,#b30019);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:var(--glow)}
.hn{font-weight:700;font-size:17px}.hu{color:var(--mut);font-size:13px}
.ver{margin-inline-start:auto;color:var(--mut);font-size:11px}
.hero{background:linear-gradient(155deg,#4a0713 0%,#16090c 55%,#0c0c0f);border:1px solid #6a1020;border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 10px 34px #ff1f3d1f;position:relative;overflow:hidden}.hero::after{content:'';position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(#ff1f3d55,transparent 70%)}
.hero small{color:var(--mut)}
.big{font-size:40px;font-weight:800;color:#fff;text-shadow:0 0 24px #ff1f3d99;line-height:1.1;margin:4px 0}
.big span{font-size:18px;color:var(--tx);font-weight:600;margin-inline-start:6px}
.sub{color:var(--mut);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--tx)}
.q i{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#ff3b55,#c4001c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:24px;box-shadow:var(--glow)}
.q.off i{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.ttl{font-weight:700}.dsc{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.7}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--card2);color:var(--mut)}
.pill.on{background:#3a0a12;color:#ff8a97}.pill.bad{background:#2a2a31;color:#fff}
.btn{background:linear-gradient(145deg,#ff2f4b,#d4001f);color:#fff;box-shadow:0 6px 20px #ff1f3d3a;font-weight:700;border-radius:14px;padding:12px 16px;text-align:center;display:block;width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;width:auto;display:inline-block;border-radius:11px;font-size:13px}
.btn.red{background:#26262d;color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.sw{width:50px;height:30px;border-radius:99px;background:#33373e;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{inset-inline-start:23px;background:#fff}
.sec-t{font-weight:800;font-size:16px;margin:20px 2px 6px}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:rgba(9,9,11,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:6px 0;border-radius:12px}
nav button b{font-size:21px;font-weight:400;filter:grayscale(1) opacity(.7)}
nav button.on{color:#fff}nav button.on b::after{content:'';display:block;width:18px;height:3px;border-radius:3px;background:var(--acc);margin:2px auto 0;box-shadow:var(--glow)}nav button.on b{filter:none}
.search{margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:var(--glow)}
.feat{padding:12px 14px}
.feat .more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.feat.open .more{display:block}
code,.code{background:var(--card2);border-radius:8px;padding:3px 8px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:rtl;unicode-bidi:plaintext;display:inline-block;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;font-size:13px}
.opt.on{border-color:var(--acc);color:#fff;background:#2e0a12;font-weight:700;box-shadow:inset 0 0 0 1px #ff1f3d55}
.dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;border:2px solid #0006}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border:0}
.pos{color:#fff}.neg{color:var(--red)}
.pv{width:100%;border-radius:16px;margin-top:10px;display:block}
#toast{position:fixed;top:12px;inset-inline:14px;z-index:99;background:#fff;color:#111;border-radius:14px;padding:12px 14px;text-align:center;font-weight:600;transform:translateY(-120px);transition:.25s}
#toast.show{transform:none}#toast.err{background:var(--acc);color:#fff}
.load{text-align:center;color:var(--mut);padding:50px 0}
.back{color:var(--acc);padding:12px 2px;font-weight:700}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fonts .opt{font-size:15px;direction:ltr}
.mono{white-space:pre-wrap;font-size:13.5px;line-height:1.9}

/* games */
.gcard{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:linear-gradient(160deg,#1d0a10,#121216);border:1px solid #3a1019;border-radius:18px;padding:16px 8px;transition:.15s}
.gcard:active{transform:scale(.97);border-color:var(--acc)}.gcard i{font-style:normal;font-size:38px;filter:drop-shadow(0 4px 14px #ff1f3d77)}.gcard b{font-size:15px}.gcard small{color:var(--mut);font-size:11.5px;line-height:1.6}
.stage{min-height:190px;border-radius:22px;background:radial-gradient(circle at 50% 0%,#3a0a14,#0d0d11 70%);border:1px solid #4a1019;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;margin:10px 0;text-align:center;overflow:hidden}
.face{font-size:96px;line-height:1;filter:drop-shadow(0 8px 20px #ff1f3d88)}.face.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(10deg) translateY(-8px)}100%{transform:rotate(-12deg) translateY(0)}}
.coin{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d5d5dc 60%,#8d8d98);display:grid;place-items:center;font-size:54px;box-shadow:0 10px 30px #ff1f3d55,inset 0 -6px 12px #0003}
.coin.flip{animation:flip 1.2s ease-in-out}@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-50px)}100%{transform:rotateY(1800deg) translateY(0)}}
.wheel{width:150px;height:150px;border-radius:50%;background:conic-gradient(#e11 0 10deg,#111 10deg 20deg,#e11 20deg 30deg,#111 30deg 40deg,#e11 40deg 50deg,#111 50deg 60deg,#e11 60deg 70deg,#111 70deg 80deg,#e11 80deg 90deg,#111 90deg 100deg,#e11 100deg 110deg,#111 110deg 120deg,#e11 120deg 130deg,#111 130deg 140deg,#e11 140deg 150deg,#111 150deg 160deg,#e11 160deg 170deg,#111 170deg 180deg,#e11 180deg 190deg,#111 190deg 200deg,#e11 200deg 210deg,#111 210deg 220deg,#e11 220deg 230deg,#111 230deg 240deg,#e11 240deg 250deg,#111 250deg 260deg,#e11 260deg 270deg,#111 270deg 280deg,#e11 280deg 290deg,#111 290deg 300deg,#e11 300deg 310deg,#111 310deg 320deg,#e11 320deg 330deg,#111 330deg 340deg,#e11 340deg 350deg,#111 350deg 360deg);border:6px solid #fff;display:grid;place-items:center;box-shadow:var(--glow);position:relative}
.wheel.spin{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wheel span{width:64px;height:64px;border-radius:50%;background:#070709;border:3px solid #fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.wheel span.r{background:#c4001c}.wheel span.b{background:#000}
.reels{display:flex;gap:8px;direction:ltr}.reel{width:64px;height:72px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:inset 0 -6px 10px #0002}
.reel.spin{animation:blink .12s infinite}@keyframes blink{50%{background:#ffd9de}}
.who{font-size:12.5px;color:var(--mut);margin-top:4px}
.vs{display:flex;align-items:center;gap:18px;direction:ltr}.vs b{font-size:46px;min-width:90px}.vs span{color:var(--acc);font-weight:800;font-size:20px}
.res{border-radius:16px;padding:14px;text-align:center;font-weight:800;font-size:18px;margin:8px 0;animation:pop .35s}
.res.win{background:linear-gradient(145deg,#ff2f4b,#b30019);color:#fff;box-shadow:var(--glow)}.res.lose{background:var(--card2);color:#fff;border:1px solid var(--line)}.res.tie{background:#fff;color:#111}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.betrow{display:flex;gap:8px;flex-wrap:wrap}.betrow .opt{flex:1;min-width:58px}
.bal{display:inline-flex;gap:6px;align-items:center;background:#2e0a12;border:1px solid #5a101c;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.cdn{margin:2px 0 6px}.num9{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;direction:ltr}.num9 .opt{padding:10px 0}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"><div class="load">در حال بارگذاری…</div></div>
<nav id="nav"></nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#070709'); tg.setBackgroundColor('#070709'); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
let S = null, TAB = 'home', SUB = null, FEAT = null, FOLDER = 0, Q = '';

async function api(name, body) {
  const r = await fetch('/api/' + name, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : ''}, body: JSON.stringify(body || {})});
  let j; try { j = await r.json(); } catch (e) { j = {ok: false, error: 'پاسخ نامعتبر'}; }
  if (!j.ok) { toast(j.error || 'خطا', true); throw new Error(j.error); }
  return j;
}
let tt;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 2600); if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred(err ? 'error' : 'success'); } catch (e) {} }
function tick() { if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function openLink(u) { if (!u) return; if (tg && /t\.me/.test(u)) tg.openTelegramLink(u); else if (tg) tg.openLink(u); else window.open(u); }
const copy = async t => { try { await navigator.clipboard.writeText(t); toast('کپی شد'); } catch (e) { toast(t); } };
const sw = on => `<div class="sw ${on ? 'on' : ''}"></div>`;

const TABS = [['home', '🏠', 'خانه'], ['games', '🎮', 'بازی‌ها'], ['feat', '🧩', 'قابلیت‌ها'], ['clock', '⏰', 'ساعت'], ['wallet', '💎', 'کیف پول'], ['more', '☰', 'بیشتر']];
function nav() { $('#nav').innerHTML = TABS.map(t => `<button class="${TAB === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join(''); }
function go(t, sub) { TAB = t; SUB = sub || null; FEAT = null; window.scrollTo(0, 0); render(); }
function back() { if (SUB) { SUB = null; render(); } }
if (tg) { tg.BackButton.onClick(() => { SUB ? back() : tg.close(); }); }

async function load() { S = (await api('state')); render(); }
async function render() {
  nav();
  if (tg) { SUB ? tg.BackButton.show() : tg.BackButton.hide(); }
  const el = $('#app');
  if (!S) return;
  try {
    if (SUB) el.innerHTML = await VIEWS[SUB]();
    else el.innerHTML = header() + await VIEWS[TAB]();
  } catch (e) { el.innerHTML = header() + '<div class="load">خطا در بارگذاری؛ دوباره امتحان کن</div>'; }
  if (SUB && VIEWS['after_' + SUB]) VIEWS['after_' + SUB]();
}
function header() {
  const ini = esc((S.name || '?').trim().charAt(0).toUpperCase());
  return `<header><div class="av">${ini}</div><div><div class="hn">${esc(S.name)}</div><div class="hu">${S.username ? '@' + esc(S.username) : 'شناسه: ' + S.uid}</div></div><div class="ver">v${esc(S.version)}</div></header>`;
}
const noSelf = () => !S.has_self ? `<div class="card"><div class="ttl">هنوز سلف نساختی</div><div class="dsc">برای ساخت سلف باید با شماره‌ات وارد بشی؛ این کار فقط داخل چت ربات انجام میشه.</div><br><button class="btn" onclick="api('menu').then(()=>{toast('منوی ربات فرستاده شد');tg&&setTimeout(()=>tg.close(),700)})">ساخت سلف داخل ربات</button></div>` : '';

const VIEWS = {
  async home() {
    const st = !S.has_self ? ['ساخته نشده', ''] : S.running ? (S.selfon ? ['فعال و روشن', 'on'] : ['خاموش (هزینه کسر میشه)', '']) : ['متوقف (الماس کافی نیست)', 'bad'];
    return `<div class="hero"><small>موجودی شما</small>
      <div class="big num">${S.admin ? '∞' : fa(S.balance)}<span>الماس</span></div>
      <div class="sub">${S.admin ? 'مالک — بدون محدودیت' : '≈ ' + fa(S.toman) + ' تومان'} &nbsp;•&nbsp; ⏳ ${esc(S.left)}</div></div>
    <div class="quick">
      <button class="q" onclick="buy()"><i>＋</i>شارژ</button>
      <button class="q ${S.selfon ? '' : 'off'}" onclick="power()"><i>⏻</i>${S.selfon ? 'سلف روشن' : 'سلف خاموش'}</button>
      <button class="q" onclick="go('feat')"><i>🧩</i>قابلیت‌ها</button>
      <button class="q" onclick="go('wallet')"><i>👥</i>دعوت</button>
    </div>
    ${noSelf()}
    <div class="card"><div class="row"><div class="grow"><div class="ttl">📡 وضعیت سلف</div><div class="dsc">مصرف ${S.rate} الماس در ساعت</div></div><span class="pill ${st[1]}">${st[0]}</span></div></div>
    <div class="sec-t">میانبرها</div>
    <div class="card" onclick="go('games')" style="border-color:#5a101c;background:linear-gradient(150deg,#2a0a10,#121216)"><div class="row"><div class="grow"><div class="ttl">🎮 بازی‌ها (مستقیم داخل مینی‌اپ)</div><div class="dsc">تاس، سکه، رولت، کازینو، بازی ۲۰ و چالش — با ربات، منصفانه با random.org</div></div>›</div></div>
    <div class="card" onclick="go('clock')"><div class="row"><div class="grow"><div class="ttl">⏰ ساعت زنده و عکس پروفایل</div><div class="dsc">اسم، فامیل، بیو و ساعت روی عکس با ۲۹ طرح</div></div>›</div></div>
    <div class="card" onclick="go('feat')"><div class="row"><div class="grow"><div class="ttl">🧩 همه‌ی قابلیت‌های پنل</div><div class="dsc">روشن/خاموش، تنظیم و راهنمای هر دستور</div></div>›</div></div>
    <div class="card" onclick="go('wallet')"><div class="row"><div class="grow"><div class="ttl">👥 زیرمجموعه‌گیری</div><div class="dsc">${fa(S.invited)} نفر تا الان • هر نفر ${fa(S.ref_bonus)} الماس</div></div>›</div></div>`;
  },


  async games() {
    GM = await api('games');
    const L = [['dice', '🎲', 'تاس', 'زوج/فرد ×۲ • حدس دقیق ×۶'], ['coin', '🪙', 'شیر یا خط', 'برد ×۲'], ['roulette', '🎡', 'رولت', 'رنگ ×۲ • عدد ×۳۶'],
      ['casino', '🎰', 'کازینو', 'اسلات تو و ربات • ×۲'], ['duel', '⚔️', 'بازی ۲۰', 'قرعه‌ی عدد با ربات'], ['chal', '🙈', 'چالش عدد مخفی', 'عدد مخفی ۱ تا ۹']];
    return `<div class="hero"><small>🍀 همه‌ی بازی‌ها شانسیه</small><div class="ttl" style="font-size:18px;margin:6px 0">شانس برد تو و ربات دقیقاً برابره</div>
      <div class="sub">قرعه‌ی همه‌ی بازی‌ها از random.org • حداقل ورودی ${fa(GM.min_bet)} الماس</div></div>
    <div class="sec-t">🤖 بازی با ربات (همین‌جا)</div>
    <div class="grid c2">${L.map(g => `<button class="gcard" onclick="openGame('${g[0]}')"><i>${g[1]}</i><b>${g[2]}</b><small>${g[3]}</small></button>`).join('')}</div>
    <div class="sec-t">👥 بازی با کاربران (داخل گپ)</div>
    <div class="card"><div class="dsc" style="margin:0 0 10px">بازی بین کاربرها توی گپ مخصوص بازی انجام میشه؛ مثل رولت، چالش عدد مخفی، کازینو دونفره، سکه و بازی ۲۰ (دو/سه‌نفره).
      برنده کل جایزه رو منهای ${fa(GM.fee)}٪ مالیات می‌گیره.</div>
      <div><span class="code">بازی ها</span> <span class="code">رولت 50</span> <span class="code">چالش 50</span> <span class="code">کازینو 50</span> <span class="code">سکه 50</span> <span class="code">بازی 20</span></div>
      ${GM.game_link ? `<br><button class="btn" onclick="openLink(GM.game_link)">👥 ورود به گپ بازی</button>` : '<div class="dsc">مدیر هنوز لینک گپ بازی رو تنظیم نکرده.</div>'}</div>`;
  },

  async game() {
    const g = GK, T = {dice: '🎲 تاس', coin: '🪙 شیر یا خط', roulette: '🎡 رولت', casino: '🎰 کازینو', duel: '⚔️ بازی ۲۰', chal: '🙈 چالش عدد مخفی'}[g];
    const o = GO[g], M = GM.mult;
    let opts = '', rule = '', stage = '<div class="face">🎲</div>';
    if (g === 'dice') {
      rule = `زوج یا فرد ×${fa(M.dice_parity)} • حدس دقیق ×${fa(M.dice_exact)}`;
      opts = `<div class="grid c3">${[['even', 'زوج'], ['odd', 'فرد'], ['exact', '🎯 حدس دقیق']].map(x => `<button class="opt ${o.mode === x[0] ? 'on' : ''}" onclick="setO('mode','${x[0]}')">${x[1]}</button>`).join('')}</div>`
        + (o.mode === 'exact' ? `<div class="grid c4" style="margin-top:8px;grid-template-columns:repeat(6,1fr)">${[1,2,3,4,5,6].map(n => `<button class="opt ${o.pick === n ? 'on' : ''}" onclick="setO('pick',${n})">${n}</button>`).join('')}</div>` : '');
    } else if (g === 'coin') {
      rule = 'برد ×۲ • شانس ۵۰٪'; stage = '<div class="coin" id="coin">🪙</div>';
      opts = `<div class="grid c2">${[['h', '🦁 شیر'], ['t', '✍️ خط']].map(x => `<button class="opt ${o.pick === x[0] ? 'on' : ''}" onclick="setO('pick','${x[0]}')">${x[1]}</button>`).join('')}</div>`;
    } else if (g === 'roulette') {

    a.textContent = r.me; b.textContent = r.bot; resBox(r, `مالیات ${fa(r.tax)} 💎 از جایزه کم شد`); },
  async chal(r) { const a = $('#c_me'), b = $('#c_bot'), t = $('#c_t'); a.textContent = '🔒'; b.textContent = '🔒'; t.textContent = 'قرعه‌ی عدد هدف از random.org …'; await sleep(1300);
    a.textContent = r.pick; b.textContent = r.bot; await sleep(700); t.textContent = '🎯 عدد هدف: ' + r.target; resBox(r, r.how === 'coin' ? 'مساوی شد؛ برنده با قرعه‌ی سکه مشخص شد 🪙' : 'نزدیک‌تر به عدد هدف برنده‌ست'); },
};
async function play() {
  if (busy) return; busy = true; const btn = $('#playbtn'); btn.disabled = true; $('#res').innerHTML = '';
  try { const r = await api('game_play', {game: GK, bet: GB, ...GO[GK]}); await ANIM[GK](r); GM.balance_text = r.balance_text; S.balance = r.balance; S.balance_text = r.balance_text;
    const b = $('#balc'); if (b) b.textContent = '💎 ' + r.balance_text; }
  catch (e) {} finally { busy = false; btn.disabled = false; }
}

// ---------- actions
async function tog(cmd) {
  try { const r = await api('toggle', {cmd}); tick(); if (r.note) toast(r.note); render(); } catch (e) {}
}
async function power() { try { await api('selfpower', {on: !S.selfon}); S.selfon = !S.selfon; toast(S.selfon ? 'سلف روشن شد' : 'سلف خاموش شد'); render(); } catch (e) {} }
async function buy() { try { await api('buy'); toast('صفحه‌ی خرید توی ربات باز شد'); tg && setTimeout(() => tg.close(), 700); } catch (e) {} }
function openPanel(p) { const m = {clock: ['clock'], cpic: ['clock'], style: ['more', 'style'], afk: ['more', 'afk'], kw: ['more', 'kw'], profile: ['more', 'profile']}[p]; go(m[0], m[1]); }
async function act(key) {
  try { const r = await api('action', {key}); const o = $('#out') || document.body.appendChild(Object.assign(document.createElement('div'), {id: 'out'}));
    if (tg && tg.showPopup && r.text.length < 500) tg.showPopup({message: r.text}); else { o.innerHTML = `<div class="card mono">${esc(r.text)}</div>`; o.scrollIntoView(); } } catch (e) {}
}
async function clk(target, on) { try { await api('clock_set', {target, on}); tick(); render(); } catch (e) {} }
async function clkFont(font) { try { await api('clock_set', {font}); tick(); render(); } catch (e) {} }
async function cp(b) { try { const r = await api('cpic_set', b); tick(); if (r.warn) toast(r.warn, true); else toast('انجام شد'); render(); } catch (e) {} }
async function preview() { const o = $('#pv'); o.innerHTML = '<div class="load">در حال ساخت…</div>'; try { const r = await api('cpic_preview'); o.innerHTML = `<img class="pv" src="${r.img}">`; } catch (e) { o.innerHTML = ''; } }
async function redeem() { try { const r = await api('redeem', {code: $('#code').value}); toast(`🎁 ${fa(r.amount)} الماس اضافه شد`); await load(); } catch (e) {} }
async function stySet(b) { try { await api('style_set', b); tick(); render(); } catch (e) {} }
async function afkSave() { try { await api('afk_set', {text: $('#afk').value}); toast('ذخیره شد'); } catch (e) {} }
async function kwAdd() { try { await api('kw_set', {kw: $('#kw1').value, resp: $('#kw2').value}); toast('اضافه شد'); render(); } catch (e) {} }
async function kwDel(kw) { try { await api('kw_set', {kw, delete: true}); render(); } catch (e) {} }
async function prof(f) { const v = f === 'name' ? $('#pn').value : $('#pb').value; try { await api('profile_set', {[f]: v}); toast('تغییر کرد'); } catch (e) {} }
async function gift() { try { await api('admin_code', {code: $('#gc').value, amount: +$('#ga').value, max: +$('#gm').value}); toast('ساخته شد'); render(); } catch (e) {} }
async function gdel(code) { try { await api('admin_code', {code, delete: true}); render(); } catch (e) {} }

load().catch(() => { $('#app').innerHTML = '<div class="load">این صفحه فقط از داخل ربات تلگرام کار می‌کنه.<br>ربات رو باز کن و دکمه‌ی «پنل» رو بزن.</div>'; });
</script>
</body>
</html>
