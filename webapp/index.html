<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>پنل سلف</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070709;--card:#121216d9;--card2:#1b1b21d9;--line:#2a2a31;--tx:#ffffff;--mut:#9d9da8;--acc:#ff1f3d;--acc2:#ff5a6e;--acc-tx:#ffffff;--red:#ff6b78;--ok:#ffffff;--glow:0 0 22px #ff1f3d66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#030303}html,body{margin:0;color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,-apple-system,sans-serif;font-size:15px}
body{background:transparent;padding:0 14px calc(86px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:center;gap:12px;padding:16px 2px 6px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ff3b55,#b30019);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:var(--glow)}
.hn{font-weight:700;font-size:17px}.hu{color:var(--mut);font-size:13px}
.ver{margin-inline-start:auto;color:var(--mut);font-size:11px}
.hero{background:linear-gradient(155deg,#4a0713 0%,#16090c 55%,#0c0c0f);border:1px solid #6a1020;border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 10px 34px #ff1f3d1f;position:relative;overflow:hidden}.hero::after{content:'';position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(#ff1f3d55,transparent 70%)}
.hero small{color:var(--mut)}
.big{font-size:40px;font-weight:800;color:#fff;text-shadow:0 0 24px #ff1f3d99;line-height:1.1;margin:4px 0}
.big span{font-size:18px;color:var(--tx);font-weight:600;margin-inline-start:6px}
.sub{color:var(--mut);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--tx)}
.q i{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#ff3b55,#c4001c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:24px;box-shadow:var(--glow)}
.q.off i{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.ttl{font-weight:700}.dsc{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.7}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--card2);color:var(--mut)}
.pill.on{background:#3a0a12;color:#ff8a97}.pill.bad{background:#2a2a31;color:#fff}
.btn{background:linear-gradient(145deg,#ff2f4b,#d4001f);color:#fff;box-shadow:0 6px 20px #ff1f3d3a;font-weight:700;border-radius:14px;padding:12px 16px;text-align:center;display:block;width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;width:auto;display:inline-block;border-radius:11px;font-size:13px}
.btn.red{background:#26262d;color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.sw{width:50px;height:30px;border-radius:99px;background:#33373e;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{inset-inline-start:23px;background:#fff}
.sec-t{font-weight:800;font-size:16px;margin:20px 2px 6px}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:rgba(6,6,8,.84);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:6px 0;border-radius:12px}
nav button b{font-size:21px;font-weight:400;filter:grayscale(1) opacity(.7)}
nav button.on{color:#fff}nav button.on b::after{content:'';display:block;width:18px;height:3px;border-radius:3px;background:var(--acc);margin:2px auto 0;box-shadow:var(--glow)}nav button.on b{filter:none}
.search{margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:var(--glow)}
.feat{padding:12px 14px}
.feat .more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.feat.open .more{display:block}
code,.code{background:var(--card2);border-radius:8px;padding:3px 8px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:rtl;unicode-bidi:plaintext;display:inline-block;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;font-size:13px}
.opt.on{border-color:var(--acc);color:#fff;background:#2e0a12;font-weight:700;box-shadow:inset 0 0 0 1px #ff1f3d55}
.dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;border:2px solid #0006}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border:0}
.pos{color:#fff}.neg{color:var(--red)}
.pv{width:100%;border-radius:16px;margin-top:10px;display:block}
#toast{position:fixed;top:12px;inset-inline:14px;z-index:99;background:#fff;color:#111;border-radius:14px;padding:12px 14px;text-align:center;font-weight:600;transform:translateY(-120px);transition:.25s}
#toast.show{transform:none}#toast.err{background:var(--acc);color:#fff}
.load{text-align:center;color:var(--mut);padding:50px 0}
.back{color:var(--acc);padding:12px 2px;font-weight:700}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fonts .opt{font-size:15px;direction:ltr}
.mono{white-space:pre-wrap;font-size:13.5px;line-height:1.9}

/* games */
.gcard{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:linear-gradient(160deg,#1d0a10,#121216);border:1px solid #3a1019;border-radius:18px;padding:16px 8px;transition:.15s}
.gcard:active{transform:scale(.97);border-color:var(--acc)}.gcard i{font-style:normal;font-size:38px;filter:drop-shadow(0 4px 14px #ff1f3d77)}.gcard b{font-size:15px}.gcard small{color:var(--mut);font-size:11.5px;line-height:1.6}
.stage{min-height:190px;border-radius:22px;background:radial-gradient(circle at 50% 0%,#3a0a14,#0d0d11 70%);border:1px solid #4a1019;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;margin:10px 0;text-align:center;overflow:hidden}
.face{font-size:96px;line-height:1;filter:drop-shadow(0 8px 20px #ff1f3d88)}.face.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(10deg) translateY(-8px)}100%{transform:rotate(-12deg) translateY(0)}}
.coin{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d5d5dc 60%,#8d8d98);display:grid;place-items:center;font-size:54px;box-shadow:0 10px 30px #ff1f3d55,inset 0 -6px 12px #0003}
.coin.flip{animation:flip 1.2s ease-in-out}@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-50px)}100%{transform:rotateY(1800deg) translateY(0)}}
.wheel{width:150px;height:150px;border-radius:50%;background:conic-gradient(#e11 0 10deg,#111 10deg 20deg,#e11 20deg 30deg,#111 30deg 40deg,#e11 40deg 50deg,#111 50deg 60deg,#e11 60deg 70deg,#111 70deg 80deg,#e11 80deg 90deg,#111 90deg 100deg,#e11 100deg 110deg,#111 110deg 120deg,#e11 120deg 130deg,#111 130deg 140deg,#e11 140deg 150deg,#111 150deg 160deg,#e11 160deg 170deg,#111 170deg 180deg,#e11 180deg 190deg,#111 190deg 200deg,#e11 200deg 210deg,#111 210deg 220deg,#e11 220deg 230deg,#111 230deg 240deg,#e11 240deg 250deg,#111 250deg 260deg,#e11 260deg 270deg,#111 270deg 280deg,#e11 280deg 290deg,#111 290deg 300deg,#e11 300deg 310deg,#111 310deg 320deg,#e11 320deg 330deg,#111 330deg 340deg,#e11 340deg 350deg,#111 350deg 360deg);border:6px solid #fff;display:grid;place-items:center;box-shadow:var(--glow);position:relative}
.wheel.spin{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wheel span{width:64px;height:64px;border-radius:50%;background:#070709;border:3px solid #fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.wheel span.r{background:#c4001c}.wheel span.b{background:#000}
.reels{display:flex;gap:8px;direction:ltr}.reel{width:64px;height:72px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:inset 0 -6px 10px #0002}
.reel.spin{animation:blink .12s infinite}@keyframes blink{50%{background:#ffd9de}}
.who{font-size:12.5px;color:var(--mut);margin-top:4px}
.vs{display:flex;align-items:center;gap:18px;direction:ltr}.vs b{font-size:46px;min-width:90px}.vs span{color:var(--acc);font-weight:800;font-size:20px}
.res{border-radius:16px;padding:14px;text-align:center;font-weight:800;font-size:18px;margin:8px 0;animation:pop .35s}
.res.win{background:linear-gradient(145deg,#ff2f4b,#b30019);color:#fff;box-shadow:var(--glow)}.res.lose{background:var(--card2);color:#fff;border:1px solid var(--line)}.res.tie{background:#fff;color:#111}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.betrow{display:flex;gap:8px;flex-wrap:wrap}.betrow .opt{flex:1;min-width:58px}
.bal{display:inline-flex;gap:6px;align-items:center;background:#2e0a12;border:1px solid #5a101c;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.cdn{margin:2px 0 6px}.num9{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;direction:ltr}.num9 .opt{padding:10px 0}

/* ===== space background (from mmd.html): glow sheen + floating glows + starfield + planet + vignette + grain ===== */
.sbg{position:fixed;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 36%,#ffffff0a 47%,#ffffff12 50%,#ffffff0a 53%,transparent 64%),radial-gradient(60% 50% at 15% 10%,#ffffff12,transparent 70%),radial-gradient(50% 45% at 90% 80%,#ffffff0d,transparent 70%),#030303}
.sbg:before,.sbg:after{content:"";position:absolute;border-radius:50%;will-change:transform}
.sbg:before{width:46vmax;height:46vmax;left:28%;top:28%;background:radial-gradient(circle,#ffffff14,transparent 65%);animation:sdr 22s ease-in-out infinite alternate}
.sbg:after{width:40vmax;height:40vmax;right:4%;bottom:-10%;background:radial-gradient(circle,#ffffff10,transparent 65%);animation:sdr 26s ease-in-out -8s infinite alternate-reverse}
@keyframes sdr{to{transform:translate(-12vw,8vh) scale(1.2)}}
.sbl{position:fixed;z-index:-1;border-radius:50%;opacity:.26;animation:sfl 14s ease-in-out infinite alternate;will-change:transform}
.sb1{width:560px;height:560px;top:-220px;right:-170px;background:radial-gradient(circle,#fff,transparent 68%)}
.sb2{width:520px;height:520px;bottom:-220px;left:-170px;background:radial-gradient(circle,#fff,transparent 68%);animation-delay:-6s}
@keyframes sfl{to{transform:translate(-50px,70px) scale(1.15)}}
#sp,.svig,.sgrain,.splanet{position:fixed;z-index:-1;pointer-events:none}
#sp{inset:0;width:100%;height:100%;transform:translateZ(0);contain:strict}
.svig{inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,#000000c0 100%)}
.sgrain{inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.splanet{width:50vmin;height:50vmin;left:-16vmin;bottom:-22vmin;border-radius:50%;background:radial-gradient(circle at 74% 26%,#fafafa,#9b9b9b 30%,#3b3b3b 55%,#070707 78%);box-shadow:0 0 100px #ffffff30,inset 12px 12px 50px #ffffff55,inset -50px -50px 100px #000;animation:spf 30s ease-in-out infinite alternate}
@keyframes spf{to{transform:translate(4vmin,-3vmin) rotate(6deg)}}
html[data-pq="2"] .sbl,html[data-pq="2"] .sbg:before,html[data-pq="2"] .sbg:after,html[data-pq="3"] .sbl,html[data-pq="3"] .sbg:before,html[data-pq="3"] .sbg:after,html[data-pq="3"] .splanet{animation:none}
html[data-pq="2"] .sgrain,html[data-pq="3"] .sgrain{display:none}
/* glass cards so the background shows through */
.card{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[data-pq="2"] .card,html[data-pq="3"] .card{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ===== lucky wheel ===== */
.wh-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wh-hero{text-align:center}.wh-hero .ttl{font-size:17px;margin:6px 0 2px}
.wbox{position:relative;width:min(350px,calc(100vw - 36px));aspect-ratio:1/1;margin:6px auto 8px}
.wbox::before{content:"";position:absolute;inset:7% 7% 1%;border-radius:50%;background:radial-gradient(circle,#ffb43c66,transparent 68%);filter:blur(16px);animation:wglow 3s ease-in-out infinite alternate}
@keyframes wglow{to{opacity:.5;transform:scale(1.07)}}
#wc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.wst{text-align:center;margin:2px 0 12px;min-height:44px}
.wst .big2{font-size:22px;font-weight:800}.wst .cdn2{font-size:26px;font-weight:800;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}
.wcard{border-color:#5a101c;background:linear-gradient(150deg,#2a0a10d9,#121216d9)}
.wcard.rdy{animation:wpulse 1.8s ease-in-out infinite}
@keyframes wpulse{50%{box-shadow:0 0 0 1px #ff1f3d88,0 0 26px #ff1f3d55}}
.orow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.orow:last-of-type{border:0}
.orow .v{width:74px;font-weight:800}.orow .p{width:52px;text-align:left;color:var(--mut);font-size:13px}
.obar{flex:1;height:9px;border-radius:99px;background:var(--card2);overflow:hidden}.obar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff2f4b,#ffb43c)}
.wres{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;background:#000b;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:wfade .25s}
@keyframes wfade{from{opacity:0}}
.wres .wbx{width:min(330px,100%);text-align:center;border-radius:26px;padding:26px 18px 20px;background:linear-gradient(160deg,#3a0a14,#14080b 70%);border:1px solid #7a1626;box-shadow:0 0 60px #ff1f3d44;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.wres .gem{font-size:56px;filter:drop-shadow(0 6px 18px #5cf)}.wres .amt{font-size:54px;font-weight:900;line-height:1.1;background:linear-gradient(180deg,#fff2b8,#ffb43c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #ff9a2a77)}
.wres small{display:block;color:var(--mut);margin:6px 0 16px;line-height:1.8}
</style>
</head>
<body>
<div class="sbg"></div><div class="sbl sb1"></div><div class="sbl sb2"></div><canvas id="sp"></canvas><div class="splanet"></div><div class="svig"></div><div class="sgrain"></div>
<div id="toast"></div>
<div id="app"><div class="load">در حال بارگذاری…</div></div>
<nav id="nav"></nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#030303'); tg.setBackgroundColor('#030303'); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
let S = null, TAB = 'home', SUB = null, FEAT = null, FOLDER = 0, Q = '';

async function api(name, body) {
  const r = await fetch('/api/' + name, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : ''}, body: JSON.stringify(body || {})});
  let j; try { j = await r.json(); } catch (e) { j = {ok: false, error: 'پاسخ نامعتبر'}; }
  if (!j.ok) { toast(j.error || 'خطا', true); throw new Error(j.error); }
  return j;
}
let tt;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 2600); if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred(err ? 'error' : 'success'); } catch (e) {} }
function tick() { if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function openLink(u) { if (!u) return; if (tg && /t\.me/.test(u)) tg.openTelegramLink(u); else if (tg) tg.openLink(u); else window.open(u); }
const copy = async t => { try { await navigator.clipboard.writeText(t); toast('کپی شد'); } catch (e) { toast(t); } };
const sw = on => `<div class="sw ${on ? 'on' : ''}"></div>`;

const TABS = [['home', '🏠', 'خانه'], ['games', '🎮', 'بازی‌ها'], ['feat', '🧩', 'قابلیت‌ها'], ['clock', '⏰', 'ساعت'], ['wallet', '💎', 'کیف پول'], ['more', '☰', 'بیشتر']];
function nav() { $('#nav').innerHTML = TABS.map(t => `<button class="${TAB === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join(''); }
function go(t, sub) { TAB = t; SUB = sub || null; FEAT = null; window.scrollTo(0, 0); render(); }
function back() { if (SUB) { SUB = null; render(); } }
if (tg) { tg.BackButton.onClick(() => { SUB ? back() : tg.close(); }); }

async function load() { S = (await api('state')); if (new URLSearchParams(location.search).get('go') === 'wheel') go('home', 'wheel'); else render(); }
async function render() {
  wheelStop();
  nav();
  if (tg) { SUB ? tg.BackButton.show() : tg.BackButton.hide(); }
  const el = $('#app');
  if (!S) return;
  try {
    if (SUB) el.innerHTML = await VIEWS[SUB]();
    else el.innerHTML = header() + await VIEWS[TAB]();
  } catch (e) { el.innerHTML = header() + '<div class="load">خطا در بارگذاری؛ دوباره امتحان کن</div>'; }
  if (SUB && VIEWS['after_' + SUB]) VIEWS['after_' + SUB]();
}
function header() {
  const ini = esc((S.name || '?').trim().charAt(0).toUpperCase());
  return `<header><div class="av">${ini}</div><div><div class="hn">${esc(S.name)}</div><div class="hu">${S.username ? '@' + esc(S.username) : 'شناسه: ' + S.uid}</div></div><div class="ver">v${esc(S.version)}</div></header>`;
}
const noSelf = () => !S.has_self ? `<div class="card"><div class="ttl">هنوز سلف نساختی</div><div class="dsc">برای ساخت سلف باید با شماره‌ات وارد بشی؛ این کار فقط داخل چت ربات انجام میشه.</div><br><button class="btn" onclick="api('menu').then(()=>{toast('منوی ربات فرستاده شد');tg&&setTimeout(()=>tg.close(),700)})">ساخت سلف داخل ربات</button></div>` : '';

const wheelCard = () => `<div class="card wcard ${S.wheel_ready ? 'rdy' : ''}" onclick="openWheel()"><div class="row"><div class="grow"><div class="ttl">🎡 گردونه شانس روزانه</div><div class="dsc">روزی یک‌بار رایگان بچرخون و تا ۲۰۰ الماس ببر</div></div><span class="pill ${S.wheel_ready ? 'on' : ''}">${S.wheel_ready ? '🎁 آماده!' : 'فردا'}</span></div></div>`;
const VIEWS = {
  async home() {
    const st = !S.has_self ? ['ساخته نشده', ''] : S.running ? (S.selfon ? ['فعال و روشن', 'on'] : ['خاموش (هزینه کسر میشه)', '']) : ['متوقف (الماس کافی نیست)', 'bad'];
    return `<div class="hero"><small>موجودی شما</small>
      <div class="big num">${S.admin ? '∞' : fa(S.balance)}<span>الماس</span></div>

      rule = `رنگ/زوج‌وفرد/بازه ×${fa(M.roulette_side)} • عدد دقیق ×${fa(M.roulette_exact)} (۱ تا ۳۶ بدون صفر)`;

  (function f(t) { g.clearRect(0, 0, W, H); for (const p of P) { p.vy += .42; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else c.remove(); })(t0);
}

VIEWS.wheel = async function () {

      <div class="dsc" style="margin-top:8px">📊 میانگین جایزه ≈ ${fa(d.avg)} الماس • هر روز ساعت ۰۰:۰۰ (تهران) یک چرخش جدید باز میشه • قرعه روی سرور انجام میشه</div></div>`;

<script>(()=>{const de=document.documentElement,c=document.getElementById('sp'),x=c.getContext('2d'),R=matchMedia('(prefers-reduced-motion:reduce)').matches,TC=matchMedia('(pointer:coarse)').matches,
rnd=(a,b)=>a+Math.random()*(b-a),
PAL={d:{c:['#ffffff','#ffffff','#e4e4e4','#d6e0ff'],gl:'255,255,255',hot:'255,255,255',ha:.35,sh:'255,255,255',am:1,sc:1,fl:.1,bk:1},l:{c:['#5b4bc4','#3b2a8f','#7c6ad6','#ffffff'],gl:'124,106,214',hot:'255,255,255',ha:.7,sh:'91,75,196',am:1,sc:2,fl:.5,bk:1.4}},
DPR=TC?[1.5,1.5,1,1]:[2,2,1.5,1],CNT=[1,.8,.6,.4],GAP=[0,0,26,26],G=document.createElement('canvas');G.width=G.height=64;
let Q=+de.dataset.pq||0,W=1,H=1,d=1,S=[],M=[],mx=0,my=0,tx=0,ty=0,t0=performance.now(),P=t0,L=t0,nx=t0+1500,hist=[],m4=[],fmin=1e9,rw=innerWidth,rh=innerHeight,skipT=3.5,PL=PAL.d,D=[],cap=0,busy=0;
function pal(){PL=de.dataset.theme==='light'?PAL.l:PAL.d;const g=G.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);g.clearRect(0,0,64,64);
r.addColorStop(0,'rgba('+PL.hot+',1)');r.addColorStop(.25,'rgba('+PL.gl+','+PL.ha+')');r.addColorStop(1,'rgba('+PL.gl+',0)');g.fillStyle=r;g.fillRect(0,0,64,64);
D=PL.c.map(cl=>{const o=document.createElement('canvas');o.width=o.height=32;const q=o.getContext('2d');q.fillStyle=cl;q.beginPath();q.arc(16,16,14,0,6.283);q.fill();return o});
hist.length=0;m4.length=0;skipT=(performance.now()-t0)/1000+2}
const mk=()=>{const b=Math.random()<.07;return{x:rnd(0,W),y:rnd(0,H),z:b?rnd(.7,1):rnd(.2,.9),p:rnd(0,6.28),k:Math.random()*4|0,b}};
function size(){const ow=W,oh=H;d=Math.min(devicePixelRatio||1,DPR[Q]);W=c.width=Math.round(innerWidth*d);H=c.height=Math.round(innerHeight*d);
for(const s of S){s.x*=W/ow;s.y*=H/oh}
const n=Math.round(Math.min(innerWidth*innerHeight/3000,innerWidth<700?260:460)*CNT[Q]);while(S.length>n)S.pop();while(S.length<n)S.push(mk())}
const setQ=n=>{Q=Math.min(n,3);de.dataset.pq=Q;size()},
spawn=()=>M.push({x:rnd(.3,1)*W,y:rnd(0,.4)*H,vx:-rnd(800,1200)*d,vy:rnd(300,520)*d,l:1});
function mon(ms,t){if(R||t<skipT||ms>200)return;hist.push(ms);m4.push(ms);if(m4.length>4)m4.shift();
if(m4.length==4)fmin=Math.min(fmin,(m4[0]+m4[1]+m4[2]+m4[3])/4);
if(hist.length<90)return;let A=0;for(const v of hist)A+=v;A/=90;hist.length=0;
if(!cap&&(A>19||(A>fmin*1.3&&A>10)))cap=30;else if(cap&&A>45&&Q<1)setQ(1)}
function draw(now){if(!R)requestAnimationFrame(draw);
const t=(now-t0)/1000;mon(now-P,t);P=now;
if(!R&&(now-L<GAP[Q]||now-L<cap||(t>3.4&&now<busy)))return;
const dt=Math.min((now-L)/1000,.05);L=now;
const e=R?1:Math.min(t/3.2,1),wp=Math.pow(1-e,3)*900,cx=W/2,cy=H/2,k=1-Math.exp(-dt*3.5);
mx+=(tx-mx)*k;my+=(ty-my)*k;x.clearRect(0,0,W,H);
for(const s of S){let vx=-14*s.z*d,vy=6*s.z*d;
if(wp>.5){const dx=s.x-cx,dy=s.y-cy,q=Math.hypot(dx,dy)||1,w=wp*s.z*d;vx+=dx/q*w;vy+=dy/q*w}
s.x+=vx*dt;s.y+=vy*dt;
if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20){if(wp>20){s.x=cx+rnd(-.08,.08)*W;s.y=cy+rnd(-.08,.08)*H}else{if(s.x<-20)s.x=W+20;else if(s.x>W+20)s.x=-20;if(s.y<-20)s.y=H+20;else if(s.y>H+20)s.y=-20}}
const px=s.x+mx*s.z*46*d,py=s.y+my*s.z*46*d,a=(.45+.55*Math.sin(t*(1+s.z*2)+s.p))*(.4+s.z*.6);
x.globalAlpha=(a>PL.fl?a:PL.fl)*PL.am;
if(wp>60){x.strokeStyle=PL.c[s.k];x.lineWidth=s.z*1.6*d*PL.sc;x.beginPath();x.moveTo(px,py);x.lineTo(px-vx*.07,py-vy*.07);x.stroke()}
else if(s.b){const r=(9+s.z*9)*d*PL.bk;x.drawImage(G,px-r,py-r,r*2,r*2)}
else{const r=s.z*1.6*d*PL.sc;x.drawImage(D[s.k],px-r,py-r,r*2,r*2)}}
x.globalAlpha=1;
if(!R&&now>nx&&t>3){spawn();nx=now+rnd(2500,6000)}
if(M.length){M=M.filter(m=>m.l>0);for(const m of M){m.x+=m.vx*dt;m.y+=m.vy*dt;m.l-=dt*1.1;
const g=x.createLinearGradient(m.x,m.y,m.x-m.vx*.14,m.y-m.vy*.14);g.addColorStop(0,'rgba('+PL.sh+','+m.l+')');g.addColorStop(1,'rgba('+PL.sh+',0)');
x.strokeStyle=g;x.lineWidth=1.8*d*PL.sc;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x-m.vx*.14,m.y-m.vy*.14);x.stroke()}}}
pal();size();new MutationObserver(pal).observe(de,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',()=>{if(innerWidth!==rw||Math.abs(innerHeight-rh)>200){rw=innerWidth;rh=innerHeight;size()}});
addEventListener('scroll',()=>{busy=performance.now()+160},{passive:true});
if(!TC)addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5},{passive:true});
if(!R)addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')spawn()});
document.addEventListener('visibilitychange',()=>{P=L=performance.now();hist.length=0;m4.length=0});
requestAnimationFrame(draw)})()</script>
